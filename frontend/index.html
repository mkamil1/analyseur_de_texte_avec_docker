<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analyseur de Texte Docker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
      
        <div id="auth-section">
            <h1>Authentification</h1>
            <div class="auth-box">
                <input type="text" id="username" placeholder="Nom d'utilisateur" autocomplete="off">
                <input type="email" id="email" placeholder="Email (requis pour l'inscription)" autocomplete="off">
                <input type="password" id="password" placeholder="Mot de passe" autocomplete="off">
            <div style="display: flex; flex-direction: column-reverse; align-items: center; gap: 0.5rem; margin: 0.5rem 0;">
                <input type="checkbox" id="admin-checkbox">
                <label id="admin-checkbox-label" for="admin-checkbox" style="margin: 0; text-align: center;">S'inscrire en tant qu'admin</label>
            </div>

                <input type="text" id="admin-code" placeholder="Code admin" autocomplete="off" style="display:none; margin-top:0.5rem;">
                <button id="login-btn">Se connecter</button>
                <button id="register-btn" class="btn-secondary">S'inscrire</button>
            </div>
        </div>

        <!-- Module Espace Utilisateur -->
        <div id="app-section" style="display: none;">
            <div class="user-header">
                <div>
                    <strong id="user-display"></strong><br>
                    <small id="email-display" style="color: #64748b;"></small>
                </div>
                <button id="logout-btn" class="btn-secondary" style="width: auto; margin: 0; padding: 0.4rem 0.8rem;">Déconnexion</button>
            </div>

            <h1>Analyseur de Texte</h1>
            <textarea id="text-input" placeholder="Saisissez ou collez votre texte ici..." autocomplete="off"></textarea>
            <button id="analyze-btn">Analyser le texte</button>

            <div class="results">
                <div class="stat-box">
                    <span class="stat-number" id="words">0</span>
                    <span class="stat-label">Mots</span>
                </div>
                <div class="stat-box">
                    <span class="stat-number" id="chars">0</span>
                    <span class="stat-label">Caractères</span>
                </div>
                <div class="stat-box">
                    <span class="stat-number" id="vowels">0</span>
                    <span class="stat-label">Voyelles</span>
                </div>
            </div>

            <div class="history-section">
                <h2>Mon Historique</h2>
                <div id="admin-controls" style="display:none; margin-bottom:1rem;">
                    <label for="user-select">Voir l'historique de :</label>
                    <select id="user-select"></select>
                </div>
                <div id="history-list"></div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5001/api';
        let currentUser = JSON.parse(localStorage.getItem('user')) || null;

        const authSection = document.getElementById('auth-section');
        const appSection = document.getElementById('app-section');
        const userDisplay = document.getElementById('user-display');
        const emailDisplay = document.getElementById('email-display');

        // Force-clear inputs on load to avoid browser form restoration of previous user's text
        const usernameInput = document.getElementById('username');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const textInput = document.getElementById('text-input');
        if (usernameInput) usernameInput.value = '';
        if (emailInput) emailInput.value = '';
        if (passwordInput) passwordInput.value = '';
        if (textInput) textInput.value = '';

        // Handle page restore (bfcache) and other cases where browser restores form values
        window.addEventListener('pageshow', (event) => {
            try {
                if (usernameInput) usernameInput.value = '';
                if (emailInput) emailInput.value = '';
                if (passwordInput) passwordInput.value = '';
                if (textInput) textInput.value = '';
                resetCounters();
                setAnalyzeButtonState();
                const historyList = document.getElementById('history-list');
                if (historyList) historyList.innerHTML = '';
            } catch (e) {
                console.error('pageshow cleanup failed', e);
            }
        });

        function resetCounters() {
            document.getElementById('words').textContent = '0';
            document.getElementById('chars').textContent = '0';
            document.getElementById('vowels').textContent = '0';
        }

        function clearAnalysis() {
            document.getElementById('text-input').value = '';
            resetCounters();
            document.getElementById('history-list').innerHTML = '';
            setAnalyzeButtonState();
        }

        function updateUI() {
            if (currentUser) {
                authSection.style.display = 'none';
                appSection.style.display = 'block';
                userDisplay.textContent = currentUser.username;
                emailDisplay.textContent = currentUser.email + (currentUser.role ? (' — ' + currentUser.role) : '');
                clearAnalysis();
                if (currentUser.role === 'admin') {
                    document.getElementById('admin-controls').style.display = 'block';
                    loadUsers();
                } else {
                    document.getElementById('admin-controls').style.display = 'none';
                    loadHistory(currentUser.id);
                }
            } else {
                authSection.style.display = 'block';
                appSection.style.display = 'none';
                clearAnalysis();
            }
        }

        // Action Inscription
        document.getElementById('register-btn').addEventListener('click', async () => {
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const adminCheckbox = document.getElementById('admin-checkbox');
            const adminCode = adminCheckbox.checked ? document.getElementById('admin-code').value : '';
            clearAnalysis();

            const res = await fetch(`${API_URL}/register`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, email, password, adminCode })
            });
            const data = await res.json();
            if (res.ok) {
                alert('Compte créé avec succès ! Vous pouvez à présent vous connecter.');
                document.getElementById('username').value = '';
                document.getElementById('email').value = '';
                document.getElementById('password').value = '';
            } else {
                alert(data.error);
            }
        });

        // Action Connexion
        document.getElementById('login-btn').addEventListener('click', async () => {
            const identifier = document.getElementById('username').value || document.getElementById('email').value;
            const password = document.getElementById('password').value;
            clearAnalysis();

            const res = await fetch(`${API_URL}/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ identifier, password })
            });
            const data = await res.json();
            if (res.ok) {
                currentUser = data.user;
                localStorage.setItem('user', JSON.stringify(currentUser));
                updateUI();
            } else {
                alert(data.error);
            }
        });

        // Action Déconnexion
        document.getElementById('logout-btn').addEventListener('click', () => {
            currentUser = null;
            localStorage.removeItem('user');
            updateUI();
        });

        // Reset counters automatically when textarea becomes empty
        document.getElementById('text-input').addEventListener('input', (e) => {
            const value = e.target.value || '';
            if (value.trim() === '') {
                resetCounters();
            }
        });

        // Enable/disable analyze button based on textarea content
        function setAnalyzeButtonState() {
            const btn = document.getElementById('analyze-btn');
            const value = document.getElementById('text-input').value || '';
            btn.disabled = value.trim() === '';
        }

        document.getElementById('text-input').addEventListener('input', () => {
            setAnalyzeButtonState();
        });

        const adminCheckbox = document.getElementById('admin-checkbox');
        const adminCodeInput = document.getElementById('admin-code');
        adminCheckbox.addEventListener('change', () => {
            adminCodeInput.style.display = adminCheckbox.checked ? 'block' : 'none';
        });

        // Initialize analyze button state on load
        setAnalyzeButtonState();

        // Action Analyse de texte
        document.getElementById('analyze-btn').addEventListener('click', async () => {
            const text = document.getElementById('text-input').value;
            if (!text.trim()) {
                resetCounters();
                return;
            }

            try {
                const response = await fetch(`${API_URL}/analyze`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text, user_id: currentUser.id })
                });

                const data = await response.json();
                document.getElementById('words').textContent = data.words;
                document.getElementById('chars').textContent = data.characters;
                document.getElementById('vowels').textContent = data.vowels;

                if (currentUser.role === 'admin') {
                    const sel = document.getElementById('user-select');
                    const userId = (sel && sel.value) ? sel.value : currentUser.id;
                    loadHistory(userId);
                } else {
                    loadHistory(currentUser.id);
                }
            } catch (error) {
                alert("Erreur de communication avec le serveur.");
            }
        });

       
        async function loadUsers() {
            try {
                const res = await fetch(`${API_URL}/users?requesterId=${currentUser.id}`);
                if (!res.ok) return;
                const users = await res.json();
                const sel = document.getElementById('user-select');
                sel.innerHTML = users.map(u => `<option value="${u.id}">${u.username} (${u.email})</option>`).join('');
                sel.addEventListener('change', () => {
                    loadHistory(sel.value);
                });
                if (users.length > 0) loadHistory(users[0].id);
            } catch (err) {
                console.error('Erreur users', err);
            }
        }

        async function loadHistory(userId) {
            try {
                const historyList = document.getElementById('history-list');
                historyList.innerHTML = '';
                const res = await fetch(`${API_URL}/history/${userId}?requesterId=${currentUser.id}`);
                if (!res.ok) {
                    historyList.innerHTML = '<p>Impossible de charger l\'historique.</p>';
                    return;
                }
                const history = await res.json();

                historyList.innerHTML = history.map(item => {
                    const canEdit = (currentUser.role === 'admin') || (currentUser.id === item.user_id);
                    return `
                    <div class="history-item" data-id="${item.id}">
                        <strong>"${item.text.length > 40 ? item.text.substring(0, 40) + '...' : item.text}"</strong>
                        <br>📊 Mots: ${item.word_count} | Caractères: ${item.char_count} | Voyelles: ${item.vowel_count}
                        <small>📅 ${new Date(item.created_at).toLocaleString('fr-FR')}</small>
                        ${canEdit ? `<div style="margin-top:0.5rem;">
                            <button class="edit-btn" data-id="${item.id}">Modifier</button>
                            <button class="delete-btn" data-id="${item.id}">Supprimer</button>
                        </div>` : ''}
                    </div>
                `}).join('');

                // attach handlers
                document.querySelectorAll('.edit-btn').forEach(btn => {
                    btn.addEventListener('click', async (e) => {
                        const id = e.target.dataset.id;
                        const parent = e.target.closest('.history-item');
                        const strong = parent.querySelector('strong');
                        const currentText = strong ? strong.textContent.replace(/^"|"$/g, '') : '';
                        const newText = prompt('Modifier le texte', currentText) || '';
                        if (newText.trim() === '') return;
                        try {
                            const resp = await fetch(`${API_URL}/history/${id}`, {
                                method: 'PUT',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ text: newText, requesterId: currentUser.id })
                            });
                            if (resp.ok) loadHistory(userId);
                            else alert('Échec mise à jour');
                        } catch (err) { console.error(err); alert('Erreur'); }
                    });
                });

                document.querySelectorAll('.delete-btn').forEach(btn => {
                    btn.addEventListener('click', async (e) => {
                        const id = e.target.dataset.id;
                        if (!confirm('Supprimer cette entrée ?')) return;
                        try {
                            const resp = await fetch(`${API_URL}/history/${id}?requesterId=${currentUser.id}`, { method: 'DELETE' });
                            if (resp.ok) loadHistory(userId);
                            else alert('Échec suppression');
                        } catch (err) { console.error(err); alert('Erreur'); }
                    });
                });

            } catch (err) {
                console.error("Erreur d'historique", err);
            }
        }

        updateUI();
    </script>
</body>
</html>
