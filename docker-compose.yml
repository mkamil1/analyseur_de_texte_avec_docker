version: '3.8'

services:

  db:
    image: postgres:17-alpine
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  frontend-service:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT}:80"
  
  backend-service:
    build: ./backend
    ports:
      - "${BACKEND_PORT}:5000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      ADMIN_CODE: ${ADMIN_CODE}
    depends_on:
      - db

volumes:
  postgres_data: